<div class="gallery-photos" data-gallery-manifest="{{ page.album.manifest_url | relative_url }}" data-baseurl="{{ site.baseurl }}" aria-label="{{ page.album.title }} photos">
  {% for photo in page.photos %}
    <figure>
      <a href="{{ photo.original | relative_url }}" data-photo-index="{{ photo.index }}" aria-label="Open photo {{ photo.index | plus:1 }}{% if photo.caption != '' %}: {{ photo.caption | escape }}{% endif %}">
        <img src="{{ photo.preview | relative_url }}" alt="{{ photo.alt | escape }}" width="{{ photo.width }}" height="{{ photo.height }}" loading="{% if forloop.index <= 3 %}eager{% else %}lazy{% endif %}" decoding="async">
      </a>
      {% if photo.caption != '' %}<figcaption>{{ photo.caption | escape }}</figcaption>{% endif %}
    </figure>
  {% endfor %}
</div>
<p class="gallery-status" role="status" aria-live="polite"></p>
