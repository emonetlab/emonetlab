{% assign preview = site.data.profile_images[include.path] | default: include.path %}
<a href="{{ include.path | relative_url }}" target="_blank" rel="noopener" aria-label="Open original photo of {{ include.name | escape }}">
  <img src="{{ preview | relative_url }}" alt="{{ include.name | escape }}" width="100" height="100" loading="lazy" decoding="async">
</a>
