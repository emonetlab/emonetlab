- name: Jyot Antani
  when: "2020-2025"
  role: "Postdoc"
  image: jyot-antani.jpg
  email: jyot.antani@yale.edu
  website: https://antanij.netlify.app/
  googlescholar: 3S_V-uoAAAAJ
  description: >
    Jyot is a joint postdoc with [Paul Turner Lab](https://turnerlab.yale.edu/). In his doctoral work at Texas A&M University, Jyot studied the [sensory functions of the bacterial flagellar motor](https://hdl.handle.net/1969.1/195225). His current work involves visualization of the interactions between bacteria and phages- the viruses that infect bacteria. This research will be useful in the development of phage therapy strategies to battle antimicrobial resistance. In his free time, Jyot enjoys reading high fantasy, exploring parks and beaches, cooking, and eating.
  now: >
    Scientist, Yale University; Paul Turner Lab, Center for Phage Biology and Therapy, and Quantitative Biology Institute. [Profile](https://antanij.netlify.app/)
  past: >
    PhD, Texas A&M University (2021); postdoctoral research at Yale University with Paul Turner and Thierry Emonet.

- name: Samuel Brudner
  when: "2022-2026"
  role: "Postdoc"
  image: sam-brudner.png
  email: samuel.brudner@yale.edu
  description: >
    Sam is interested in the mechanics of adaptive animal behavior. He studies how hungry fruit flies decide where to look for food based on patterns in the odors drifting over them. He was previously a grad student at Duke with Dr. Richard Mooney where he studied how young finches learn to imitate the songs of adult birds. He hopes that studying how animals solve tasks, we will broaden our understanding of what intelligence is, and how brains create it. Apart from neuroscience, Sam likes food, music, dancing, and learning about native plants and animals where he lives.
  past: >
    Doctoral research with Richard Mooney, Duke University; postdoc, Emonet Lab, Yale University (2022–2026).

